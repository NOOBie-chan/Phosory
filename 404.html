<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: #050505;
        }
        /* Tech Video Background */
        #bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.65) contrast(1.15) saturate(1.1) grayscale(0.85);
        }
        .content {
            z-index: 2;
            max-width: 680px;
            padding: 30px 20px;
        }
        h1 {
            font-size: 9.5rem;
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.05em;
            margin-bottom: 10px;
            text-shadow: 0 0 40px rgba(0, 255, 200, 0.5);
        }
        .subtitle {
            font-size: 1.85rem;
            color: #00ffcc;
            margin-bottom: 12px;
            font-weight: 500;
        }
        p {
            font-size: 1.25rem;
            opacity: 0.9;
            margin-bottom: 45px;
            line-height: 1.5;
        }
        .home-btn {
            display: inline-block;
            padding: 16px 38px;
            background: linear-gradient(90deg, #00ffcc, #0099ff);
            color: #0a0a0a;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.15rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
        }
        .home-btn:hover {
            transform: translateY(-4px) scale(1.06);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.4);
        }
        /* Glitch Effect */
        .glitch {
            position: relative;
        }
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch::before {
            left: 3px;
            text-shadow: -3px 0 #ff00ff;
            animation: glitch-anim 1.6s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -3px;
            text-shadow: 3px 0 #00ffff;
            animation: glitch-anim2 2.1s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim {
            0%   { clip: rect(25px, 9999px, 60px, 0); }
            20%  { clip: rect(10px, 9999px, 85px, 0); }
            40%  { clip: rect(45px, 9999px, 70px, 0); }
            60%  { clip: rect(20px, 9999px, 55px, 0); }
            100% { clip: rect(35px, 9999px, 80px, 0); }
        }
        @keyframes glitch-anim2 {
            0%   { clip: rect(40px, 9999px, 90px, 0); }
            30%  { clip: rect(15px, 9999px, 50px, 0); }
            70%  { clip: rect(35px, 9999px, 75px, 0); }
            100% { clip: rect(25px, 9999px, 65px, 0); }
        }
    </style>
</head>
<body>
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://pub-446f14ba278c41468983857ae9955885.r2.dev/circuit%20loop.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="content">
        <h1 class="glitch" data-text="404">404</h1>
        <div class="subtitle">SYSTEM ERROR • CONNECTION LOST</div>
        <p>The page you're looking for could not be found in the neural network.</p>
        <a href="index.html" class="home-btn">RETURN TO BASE</a>
    </div>
    <script>
        // Ensure smooth looping
        const video = document.getElementById('bg-video');
        video.addEventListener('ended', () => {
            video.currentTime = 0;
            video.play();
        });
    </script>
</body>
</html>
