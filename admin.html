<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Phosory Admin</title>

<link rel="stylesheet" href="styles/admin.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">
    <div class="logo"></div>
    <h2>PHOSORY</h2>
  </div>

  <button onclick="showView('dashboard')">Dashboard</button>
  <button onclick="showView('orders')">Orders</button>
  <button onclick="showView('devs')">Developers</button>
  <button onclick="showView('audit')">Audit Log</button>

  <button id="logoutBtn" class="logout">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <h1 id="title">Dashboard</h1>
    <input id="search" placeholder="Search..." />
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="view active">

    <div class="grid">

      <div class="card">
        <h3>Orders</h3>
        <p id="ordersCount">0</p>
      </div>

      <div class="card">
        <h3>Developers</h3>
        <p id="devCount">0</p>
      </div>

      <div class="card">
        <h3>Approved</h3>
        <p id="approvedCount">0</p>
      </div>

      <div class="card">
        <h3>Rejected</h3>
        <p id="rejectedCount">0</p>
      </div>

    </div>
    <div class="analytics-card">
    <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- ORDERS -->
  <div id="orders" class="view hidden"></div>

  <!-- DEVELOPERS -->
  <div id="devs" class="view hidden"></div>

  <!-- AUDIT -->
  <div id="audit" class="view hidden"></div>

</div>

<script type="module" src="script/admin.js"></script>

</body>
</html>
